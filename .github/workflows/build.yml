name: build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Generate textures (not stored in the repo)
        run: |
          pip install pillow
          python3 tools/generate_textures.py
      - name: Build
        run: gradle build --no-daemon
      - name: Publish jar and resource pack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FloatingEye (latest)
          files: |
            build/libs/*.jar
            build/generated/pack/eyesky-pack.zip
            
